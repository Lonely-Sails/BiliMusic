name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # ── Linux x64 (AppImage) ──
  build-linux:
    name: 🐧 Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & package
        run: bun run dist:linux

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.AppImage
            release/*.AppImage.blockmap
          tag_name: ${{ github.event.release.tag_name }}

  # ── macOS (x64 + arm64) ──
  build-mac:
    name: 🍎 macOS (x64 + arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Vite
        run: bun run build

      - name: Package macOS (arm64)
        run: bun x electron-builder --mac --arm64 --publish never

      - name: Package macOS (x64)
        run: bun x electron-builder --mac --x64 --publish never

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.dmg
            release/*.dmg.blockmap
          tag_name: ${{ github.event.release.tag_name }}

  # ── Windows x64 (NSIS Installer) ──
  build-win:
    name: 🪟 Windows (NSIS)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build & package
        run: bun run dist:win

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*.exe
            release/*.exe.blockmap
          tag_name: ${{ github.event.release.tag_name }}
